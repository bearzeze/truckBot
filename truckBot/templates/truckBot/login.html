{% extends "truckBot/layout.html" %}

{% block title %}Login{% endblock %}

{% block body %}

<div class="container-fluid">

    {% if message %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <span>{{message}}!</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h2 class="mt-2 ms-4">Login</h2>

    {% else %}

    <h2 class="mt-4 ms-4">Login</h2>
    {% endif %}

    <form action="{% url 'login' %}" method="post" class="ms-4">
        {% csrf_token %}
        <div class="form-group mt-4 mb-2  row">
            <div class="col-12 col-sm-6 col-lg-4">
                <input autofocus class="form-control" type="text" name="username" placeholder="Username" autocomplete="off">
            </div>
        </div>
        <div class="form-group mb-3 row">

            <div class="col-12 col-sm-6 col-lg-4">
                <input class="form-control" type="password" name="password" placeholder="Password">
            </div>

        </div>
        <input class="btn btn-outline-dark mb-4" type="submit" value="Login">
    </form>

</div>

{% endblock %}
