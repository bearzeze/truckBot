{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
    <script src="https://kit.fontawesome.com/29f5942364.js" crossorigin="anonymous"></script>

    <link href="{% static 'truckBot/styles.css' %}" rel="stylesheet">


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>
<body>

        <nav class="navbar navbar-expand-lg navbar bg-dark border-bottom " data-bs-theme="dark">
            <a class="navbar-brand ms-4" href="{% url 'index' %}">truckBot</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">

                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li>

                    {% if user.is_superuser %}
                    <li class="nav-item">
                        <a class="nav-link"
                            href=" {% url 'admin:index' %}" target="_blank"><strong>admin
                                
                            </strong></a>
                    </li>
                    {% endif %}
                    
                    <li class="nav-item">
                        <a class="nav-link text-primary"
                            href=" {% url 'profile' %}"><strong>{{user.username}}</strong></a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link me-4" href="{% url 'logout' %}">Log Out</a>
                    </li>

                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link me-4" href="{% url 'login' %}">Log In</a>
                    </li>

                    {% endif %}

                </ul>
            </div>
        </nav>

{% block body %}
{% endblock %}


<script src="{% static 'truckBot/script.js' %}"></script>

</body>
</html>
